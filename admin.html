<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - AlvadtVér</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="login-modal" class="login-overlay">
        <div class="login-card" style="text-align: center;">
            <h2 style="margin-top:0;">ADMIN BELÉPÉS</h2>
            <div class="form-group"><input type="email" id="admin-email" placeholder="Admin E-mail" required></div>
            <div class="form-group"><input type="password" id="admin-pass" placeholder="Jelszó" required></div>
            <button onclick="checkPass()" class="btn-save">Belépés</button>
            <p id="login-err" style="color: #ff5252; font-size: 0.8rem; margin-top: 0.5rem; display: none;">Hibás adatok!</p>
        </div>
    </div>

    <div class="admin-box">
        <h1>AlvadtVér Adminisztráció</h1>

        <h2>Koncert Hozzáadása</h2>
        <form onsubmit="handleEventSubmit(event)">
            <div class="form-group"><label>Esemény Címe</label><input type="text" id="ev-title" required></div>
            <div class="form-group"><label>Helyszín</label><input type="text" id="ev-location" required></div>
            <div class="form-group"><label>Kezdő Dátum és Időpont</label><input type="datetime-local" id="ev-datetime" required></div>
            <div class="form-group"><label>Záró (Vége) Dátum és Időpont</label><input type="datetime-local" id="ev-endtime" required></div>
            <button type="submit" class="btn-save">+ Koncert Mentése</button>
        </form>
        <div style="margin-top: 1rem;" class="item-list" id="events-list"></div>

        <h2>Zenekari Tagok Szerkesztése</h2>
        <form onsubmit="handleMemberSubmit(event)">
            <div class="form-group">
                <label>Tag Kiválasztása / Azonosító</label>
                <select id="m-id" required style="width: 100%; padding: 0.7rem; background: #080808; border: 1px solid var(--border-admin); color: #fff; border-radius: 4px; font-size: 0.95rem;">
                    <option value="tomor">Tomor Nimród (Ének / Basszusgitár)</option>
                    <option value="buzas">Buzás Ádám (Gitár)</option>
                    <option value="szabo">Szabó Martin (Gitár)</option>
                    <option value="rozsa">Rózsa Dániel (Dob)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tag Neve</label>
                <input type="text" id="m-name" required placeholder="Pl. Szabó Martin">
            </div>
            <div class="form-group">
                <label>Milyen hangszeren / szerepben játszik</label>
                <input type="text" id="m-role" required placeholder="Pl. Gitár">
            </div>
            <div class="form-group">
                <label>Tag Fotója (Új kép a gépről)</label>
                <input type="file" id="m-file" accept="image/*" style="color: white; background: #111; padding: 0.5rem; border: 1px solid #333; width: 100%;">
            </div>
            <button type="submit" class="btn-save">Tag Mentése / Frissítése</button>
        </form>
        <div style="margin-top: 1rem;" class="item-list" id="members-list"></div>

        <h2>Fotó Feltöltése a Rendszerbe</h2>
        <form onsubmit="handlePhotoSubmit(event)">
            <div class="form-group">
                <label>Válassz képet a gépedről</label>
                <input type="file" id="ph-file" accept="image/*" required style="color: white; background: #111; padding: 0.5rem; border: 1px solid #333; width: 100%;">
            </div>
            <div class="form-group">
                <label>Leírás / Cím</label>
                <input type="text" id="ph-caption" placeholder="Pl. Koncert az S8-ban">
            </div>
            <button type="submit" class="btn-save">+ Kép Feltöltése</button>
        </form>
        <div style="margin-top: 1rem;" class="item-list" id="photos-list"></div>

        <div style="text-align: center; margin-top: 2rem;">
            <a href="index.html" style="color: var(--silver); text-decoration: none;">← Vissza a főoldalra</a>
        </div>
    </div>
