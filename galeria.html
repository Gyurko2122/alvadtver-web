<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotógaléria - AlvadtVér</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .photo-grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            padding: 20px 0;
            width: 100%;
        }
        .photo-card {
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .photo-card:hover {
            transform: scale(1.02);
            border-color: var(--red, #ff5252);
        }
        .photo-card img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            display: block;
            cursor: pointer;
        }
        .photo-caption {
            padding: 10px;
            color: #fff;
            text-align: center;
            font-family: var(--font-head);
            font-size: 1rem;
        }
        /* Lightbox nagyító */
        #lightbox-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #lightbox-img {
            max-width: 90%;
            max-height: 80vh;
            border: 2px solid var(--red, #ff5252);
        }
        #lightbox-caption {
            color: #fff;
            margin-top: 1rem;
            font-size: 1.2rem;
        }
        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html"><img src="logo.png" alt="AlvadtVér" class="nav-logo"></a>
            <div style="display:flex; align-items:center;">
                <a href="index.html" class="back-btn">← Vissza a főoldalra</a>
            </div>
        </div>
    </nav>

    <main class="gallery-container" style="max-width: 1200px; margin: 0 auto; padding: 2rem;">
        <h1 style="color: #fff; font-family: var(--font-head); margin-bottom: 1.5rem;">FOTÓGALÉRIA</h1>
        
        <!-- Itt jelennek meg a képek -->
        <div id="grid-view" class="photo-grid-container">
            <p style="color: var(--silver); text-align: center; grid-column: 1 / -1;">Képek betöltése...</p>
        </div>
    </main>

    <!-- Nagyító Modális Ablak -->
    <div id="lightbox-modal" onclick="closeLightbox()">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Nagyított kép">
        <div id="lightbox-caption"></div>
    </div>

    <!-- Firebase SDK-k -->

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
