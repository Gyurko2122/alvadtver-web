<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotógaléria - AlvadtVér</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Modális felugró ablak a kép nagyításhoz */
        #lightbox-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        #lightbox-img {
            max-width: 90%;
            max-height: 80vh;
            border: 2px solid var(--red, #ff5252);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        #lightbox-caption {
            color: #fff;
            margin-top: 1rem;
            font-family: var(--font-head);
            font-size: 1.2rem;
            text-align: center;
        }
        #lightbox-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        #lightbox-close:hover {
            color: var(--red, #ff5252);
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html"><img src="logo.png" alt="AlvadtVér" class="nav-logo"></a>
            <div style="display:flex; align-items:center;">
                <a href="index.html" class="back-btn" data-i18n="gallery_back">← Vissza a főoldalra</a>
                <div class="lang-dropdown">
                    <button class="lang-btn"><span id="current-lang-text">HUN</span> ⏷</button>
                    <div class="lang-content">
                        <a href="#" onclick="setLang('hu'); return false;">HUN</a>
                        <a href="#" onclick="setLang('en'); return false;">ENG</a>
                        <a href="#" onclick="setLang('de'); return false;">GER</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="gallery-container">
        <div class="header-flex">
            <h1 data-i18n="gallery_title">Fotógaléria</h1>
            <div class="view-toggle">
                <!-- Most már csak rács nézet van, gombok nélkül vagy egyszerűsítve -->
            </div>
        </div>

        <div id="grid-view" class="photo-grid"></div>
    </main>

    <!-- Nagyító Modális Ablak -->
    <div id="lightbox-modal" onclick="closeLightbox()">
        <span id="lightbox-close">&times;</span>
        <img id="lightbox-img" src="" alt="Nagyított kép">
        <div id="lightbox-caption"></div>
    </div>

    <!-- Firebase SDK-k -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-storage.js"></script>

    <!-- Firebase Konfiguráció -->
    <script>
      const firebaseConfig = {
          apiKey: "AIzaSyAVFxiuOIZXOx5DRAbDykL3_S6STiH-neE",
          authDomain: "alvadtver-31459.firebaseapp.com",
          databaseURL: "https://alvadtver-31459-default-rtdb.europe-west1.firebasedatabase.app",
          projectId: "alvadtver-31459",
          storageBucket: "alvadtver-31459.firebasestorage.app",
          messagingSenderId: "1089192306168",
          appId: "1:1089192306168:web:4a7d203da057675362a20d",
          measurementId: "G-01N71N6M4C"
      };
      firebase.initializeApp(firebaseConfig);
    </script>

    <script src="js/storage.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
