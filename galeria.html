<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fotógaléria - AlvadtVér</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav>
        <div class="nav-container">
            <a href="index.html"><img src="logo.png" alt="AlvadtVér" class="nav-logo"></a>
            <div style="display:flex; align-items:center;">
                <a href="index.html" class="back-btn">← Vissza a főoldalra</a>
            </div>
        </div>
    </nav>

    <main class="gallery-container">
        <h1>FOTÓGALÉRIA</h1>
        
        <!-- Itt jelennek meg a képek -->
        <div id="grid-view" class="photo-grid-container">
            <p style="color: var(--silver); text-align: center; grid-column: 1 / -1;">Képek betöltése...</p>
        </div>
    </main>

    <!-- Lightbox Modális Ablak (Smooth áttűnéssel, háttérre vagy X-re záródik) -->
    <div id="lightbox-modal" onclick="closeLightbox(event)">
        <div class="lightbox-content-wrapper" onclick="event.stopPropagation()">
            <span id="lightbox-close" onclick="closeLightboxDirect()">&times;</span>
            <img id="lightbox-img" src="" alt="Nagyított kép">
            <div id="lightbox-caption"></div>
        </div>
    </div>

    <!-- Firebase SDK-k -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
